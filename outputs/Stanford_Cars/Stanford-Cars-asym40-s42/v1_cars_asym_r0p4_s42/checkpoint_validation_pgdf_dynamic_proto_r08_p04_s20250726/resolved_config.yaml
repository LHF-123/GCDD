dataset:
  name: Stanford-Cars-asym40-s42
  root: /root/autodl-tmp/Stanford_Cars
  index_file: outputs/Stanford_Cars/noise_indices/stanford_cars_asym_r0p4_s42_index.csv
  split: train
  samples_per_class: 10
  max_classes: null
  verify_images: true
  train_split: train
  eval_split: test
  max_train_per_class: null
  max_eval_per_class: null
output:
  root: outputs/Stanford_Cars
  version: v1_cars_asym_r0p4_s42
feature:
  backend: dinov2_vitb14
  local_repo: ''
  device: auto
  batch_size: 128
  input_size: 448
  top_patch_ratio: 0.2
  random_dim: 128
  reuse: true
graph:
  knn_backend: auto
  k_pool_class: 100
  k_pool_global: 300
  k_class: 20
  k_global: 50
  rrf_k0: 20
selection:
  otsu_bins: 256
  clean_ratio_clip:
  - 0.3
  - 0.9
  epsilon: 1.0e-08
train:
  epochs: 50
  batch_size: 256
  lr: 0.05
  min_lr: 0.0
  scheduler: cosine
  seed: 42
  feature: cls
lora:
  rank: 8
  alpha: 16.0
  dropout: 0.05
  target_modules: qkv
lora_train:
  epochs: 30
  batch_size: 80
  eval_batch_size: 160
  num_workers: 4
  pin_memory: true
  lora_lr: 0.0001
  head_lr: 0.001
  weight_decay: 0.05
  scheduler: cosine
  warmup_ratio: 0.1
  amp: true
checkpoint_validation:
  protocol: fixed_clean_validation_v1
  validation_ratio: 0.1
  validation_seed: 20250726
  dynamic_ratio: 0.8
  fixed_p: 0.4
  warmup_epochs: 5
  update_interval: 5
  posthoc_oracle_test: false
  official_test_selected_only: true
  pgdf_budget_root: ''
  jal:
    alpha: 1.0
    beta: 1.0
    a: 30.0
    eps: 1.0e-08
  two_branch:
    remember_mode: fixed
    remember_rate: 0.8
    batch_size: 16
    grad_accum_steps: 2
    jocor_lambda: 0.1
    selection_metric: arithmetic mean of branch A/B validation Top-1; not ensemble
      prediction
