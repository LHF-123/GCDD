# Frozen R4-C4 high-noise extension matrix.  Relative paths are resolved from
# this file, not from the shell working directory.
schema_version: 1

runtime:
  python_executable: python
  # Formal runs require a nominal 24 GB GPU. nvidia-smi reports memory in
  # MiB and can reserve a few MiB (e.g. RTX 4090D: 24564 MiB), so use the
  # explicit vendor-capacity threshold instead of an accidental 24 GiB gate.
  minimum_gpu_memory_mib: 24000

output:
  root: ../outputs_major_revision/r4_c4_cub_cars_asym60
  instrumentation_root: ../outputs_major_revision/r4_c4_cub_cars_asym60/instrumentation

historical:
  repository_root: ..

formal:
  methods: [all_noisy_ce, dynamic_small_loss, jal_ce, pgdf]
  noise_rate: 0.6
  noise_seed: 42
  validation_ratio: 0.1
  validation_seed: 20250726
  training_seeds: [1, 42, 88]
  epochs: 30
  dynamic_ratio: 0.8
  fixed_p: 0.4
  warmup_epochs: 5
  update_interval: 5

datasets:
  cub:
    display_name: CUB-200-2011
    base_input_dir: ../outputs/CUB_200_2011/CUB-200-2011-asym40-s42/v1_cub_asym_r0p4_s42
    source_noise_index: ../outputs/CUB_200_2011/noise_indices/cub_asym_r0p4_s42_index.csv
    source_resolved_config: ../outputs_major_revision/pgdf_dynamic_ref_cub40/resolved_config.yaml
    # On a training server, map persisted /root/autodl-tmp paths here when
    # necessary, e.g. [[/root/autodl-tmp/CUB_200_2011, /datasets/CUB_200_2011]].
    path_maps: []
  cars:
    display_name: Stanford-Cars
    base_input_dir: ../outputs/Stanford_Cars/Stanford-Cars-asym40-s42/v1_cars_asym_r0p4_s42
    source_noise_index: ../outputs/Stanford_Cars/noise_indices/stanford_cars_asym_r0p4_s42_index.csv
    source_resolved_config: ../outputs_major_revision/pgdf_dynamic_ref_cars40/resolved_config.yaml
    path_maps: []
