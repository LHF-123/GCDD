dataset:
  name: Stanford-Cars-asym40-s42
  root: dataset/Stanford_Cars
  index_file: outputs/Stanford_Cars/noise_indices/stanford_cars_asym_r0p4_s42_index.csv
  train_split: train
  eval_split: test
  max_classes:
  max_train_per_class:
  max_eval_per_class:
  verify_images: true

output:
  root: outputs/Stanford_Cars
  version: v1_cars_asym_r0p4_s42

feature:
  backend: dinov2_vitb14
  local_repo: ""
  device: auto
  batch_size: 128
  input_size: 448
  top_patch_ratio: 0.2
  random_dim: 128
  reuse: true

graph:
  knn_backend: auto
  k_pool_class: 100
  k_pool_global: 300
  k_class: 20
  k_global: 50
  rrf_k0: 20

selection:
  otsu_bins: 256
  clean_ratio_clip: [0.3, 0.9]
  epsilon: 1.0e-8

train:
  epochs: 50
  batch_size: 256
  lr: 0.05
  min_lr: 0.0
  scheduler: cosine
  seed: 42
  feature: cls
